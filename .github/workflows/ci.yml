name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: The domain repos (Foodshareclub/*) are cloned explicitly with
# persist-credentials:false (anonymous public read). The stock
# `submodules: recursive` checkout fails on GitHub-hosted runners here:
# the injected GITHUB_TOKEN basic-auth header makes github.com answer 404
# for these cross-org submodule clones, while anonymous reads work.
# SHAs are resolved from the superproject's gitlinks so jobs always test
# exactly what root pins — no drift, no auth.

jobs:
  web:
    name: Web-NextJS
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: foodshare-web
    steps:
      - name: Checkout meta (resolve pins)
        uses: actions/checkout@v5
        with:
          path: meta
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve web SHA
        id: pins
        run: |
          set -euo pipefail
          sha="$(git -C meta ls-tree HEAD foodshare-web | awk '{print $3}')"
          test -n "$sha"
          echo "web_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "pinned foodshare-web=${sha}"

      - name: Checkout web at pinned SHA
        uses: actions/checkout@v5
        with:
          repository: Foodshareclub/foodshare-web
          ref: ${{ steps.pins.outputs.web_sha }}
          path: foodshare-web
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run type-check

      - name: Lint (oxlint)
        run: bun run lint:oxlint

  backend:
    name: Bun-Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: foodshare-backend
    steps:
      - name: Checkout meta (resolve pins)
        uses: actions/checkout@v5
        with:
          path: meta
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve backend SHA
        id: pins
        run: |
          set -euo pipefail
          sha="$(git -C meta ls-tree HEAD foodshare-backend | awk '{print $3}')"
          test -n "$sha"
          echo "backend_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "pinned foodshare-backend=${sha}"

      - name: Checkout backend at pinned SHA
        uses: actions/checkout@v5
        with:
          repository: Foodshareclub/foodshare-backend
          ref: ${{ steps.pins.outputs.backend_sha }}
          path: foodshare-backend
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint:oxlint

      - name: Lint (biome)
        run: bun run lint:biome

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  app:
    name: iOS-Swift
    runs-on: macos-14
    defaults:
      run:
        working-directory: foodshare-app
    steps:
      - name: Checkout meta (resolve pins)
        uses: actions/checkout@v5
        with:
          path: meta
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve app SHA
        id: pins
        run: |
          set -euo pipefail
          sha="$(git -C meta ls-tree HEAD foodshare-app | awk '{print $3}')"
          test -n "$sha"
          echo "app_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "pinned foodshare-app=${sha}"

      - name: Checkout app at pinned SHA
        uses: actions/checkout@v5
        with:
          repository: Foodshareclub/foodshare-app
          ref: ${{ steps.pins.outputs.app_sha }}
          path: foodshare-app
          fetch-depth: 1
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Swift test
        run: swift test --parallel

  quadlet:
    name: Quadlet-Sentry-Infra
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout meta
        uses: actions/checkout@v5
        with:
          path: meta
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve web SHA
        id: pins
        run: |
          set -euo pipefail
          sha="$(git -C meta ls-tree HEAD foodshare-web | awk '{print $3}')"
          test -n "$sha"
          echo "web_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout web at pinned SHA
        uses: actions/checkout@v5
        with:
          repository: Foodshareclub/foodshare-web
          ref: ${{ steps.pins.outputs.web_sha }}
          path: foodshare-web
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Quadlet units
        working-directory: meta
        run: |
          set -euo pipefail
          for unit in .config/containers/systemd/foodshare-web.container .config/containers/systemd/foodshare-cloudflared.container .config/containers/systemd/foodshare.network; do
            test -f "$unit" || { echo "missing $unit"; exit 1; }
            echo "ok: $unit"
          done
          grep -q '^PublishPort=127\.0\.0\.1:3000:3000' .config/containers/systemd/foodshare-web.container
          grep -q '^ReadOnly=true' .config/containers/systemd/foodshare-web.container
          grep -q '^NoNewPrivileges=true' .config/containers/systemd/foodshare-web.container
          grep -q '^DropCapability=ALL' .config/containers/systemd/foodshare-web.container
          grep -q '^ReadOnly=true' .config/containers/systemd/foodshare-cloudflared.container
          grep -q '^NoNewPrivileges=true' .config/containers/systemd/foodshare-cloudflared.container
          grep -q '^DropCapability=ALL' .config/containers/systemd/foodshare-cloudflared.container
          grep -q '^BindsTo=foodshare-web.service' .config/containers/systemd/foodshare-cloudflared.container
          echo "Quadlet units valid"

      - name: Validate Sentry wiring
        run: |
          set -euo pipefail
          test -f meta/.env.production.sentry
          grep -q '^NEXT_PUBLIC_SENTRY_DSN=https://' meta/.env.production.sentry
          grep -q '^SENTRY_ORG=' meta/.env.production.sentry
          grep -q '^SENTRY_PROJECT=' meta/.env.production.sentry
          test -f foodshare-web/sentry.client.config.ts
          test -f foodshare-web/sentry.server.config.ts
          test -f foodshare-web/sentry.edge.config.ts
          grep -q 'SENTRY_AUTH_TOKEN' foodshare-web/Dockerfile
          grep -q 'SENTRY_RELEASE' foodshare-web/Dockerfile
          echo "Sentry wiring valid"

      - name: Shellcheck deploy script
        working-directory: meta
        run: |
          set -euo pipefail
          bash -n DEPLOY-PRODUCTION.sh
          echo "DEPLOY-PRODUCTION.sh syntax ok"
