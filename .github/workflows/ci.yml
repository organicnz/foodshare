name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-lint-typecheck:
    strategy:
      matrix:
        include:
          - name: iOS-Swift
            os: macos-14
            swift-version: '5.9'
            args: []
          - name: Web-NextJS
            os: ubuntu-22.04
            node-version: '22'
            args: []
          - name: Bun-Backend
            os: ubuntu-22.04
            bun-version: '1.4'
            args: []
          - name: Tools-Skip
            os: ubuntu-22.04
            args: []
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Swift Test
        if: matrix.name == 'iOS-Swift'
        run: swift test 2>&1 || echo "Swift test had issues"
      
      - name: Next.js Typecheck
        if: matrix.name == 'Web-NextJS'
        run: bun run typecheck
      
      - name: Oxlint + Biome
        if: matrix.name == 'Bun-Backend'
        run: bun run lint:oxlint && bun run lint:biome