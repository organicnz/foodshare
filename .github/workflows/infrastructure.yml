name: Infrastructure

on:
  push:
    branches: [main]
    paths: ['.config/containers/systemd/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply-quadlet:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy Quadlet units to VPS
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: organic
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".config/containers/systemd/*"
          target: "~/.config/containers/systemd/"

      - name: Reload Systemd User
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: organic
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            systemctl --user daemon-reload
            systemctl --user enable --now foodshare-network.service
            systemctl --user enable --now foodshare-web.service
            systemctl --user enable --now foodshare-cloudflared.service

      - name: Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: organic
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl --fail --retry 5 --retry-delay 10 -I https://foodshare.club
            # Should return 200 OK + Cloudflare Ray ID
