name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Semantic Release
        uses: cycjimmy/github-action-semantic-release@v4
        with:
          aigithubtoken: ${{ secrets.GITHUB_TOKEN }}
          tag-format: 'v1.0.0'
          changelog-generator: github

      - name: Verify Release
        run: |
          git log --oneline v1.0.0..HEAD --no-merges > /tmp/changelog.md
          cat /tmp/changelog.md